services:
  - type: web
    name: stroke-web
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stroke-db
          property: connectionString

databases:
  - name: stroke-db
    databaseName: stroke
    user: stroke
